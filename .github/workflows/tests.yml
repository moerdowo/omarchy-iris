name: tests
on:
  push: { branches: [main, master] }
  pull_request:
  # A run can be stranded by something outside the code — the account's private
  # Actions minutes running out, a queue that never drains — and then there is
  # no way to ask for another without an empty commit. This is that way.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.14.7" }
      - name: install pinned NumPy
        env:
          NUMPY_VERSION: 2.5.2
          NUMPY_SHA256: 318b9a4c845dbea06708a29c84ee429cc3065048db34cdb799047643492050ee
          NUMPY_URL: https://files.pythonhosted.org/packages/c7/99/461bd36dbdfac6c1c53efa370bd55a83227542d0d118f1677dbf1a3dacd5/numpy-2.5.2-cp314-cp314-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        run: |
          set -euo pipefail
          numpy_wheel="$RUNNER_TEMP/numpy-2.5.2-cp314-cp314-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$numpy_wheel" "$NUMPY_URL"
          printf '%s  %s\n' "$NUMPY_SHA256" "$numpy_wheel" | sha256sum --check -
          python -m pip install --disable-pip-version-check --no-deps "$numpy_wheel"
          python -c 'import numpy; assert numpy.__version__ == "2.5.2"'
      - name: install pinned ImageMagick 7
        env:
          IMAGEMAGICK_VERSION: 7.1.2-24
          IMAGEMAGICK_SHA256: 70598022a356356c8a118a31bfff5c09585ae2c9cbc188da7365b23ca471f019
        run: |
          set -euo pipefail
          imagemagick_root="$RUNNER_TEMP/imagemagick"
          imagemagick_appimage="$imagemagick_root/ImageMagick.AppImage"
          imagemagick_bin="$imagemagick_root/bin"
          mkdir -p "$imagemagick_root" "$imagemagick_bin"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$imagemagick_appimage" \
            "https://github.com/ImageMagick/ImageMagick/releases/download/${IMAGEMAGICK_VERSION}/ImageMagick-${IMAGEMAGICK_VERSION}-gcc-x86_64.AppImage"
          printf '%s  %s\n' "$IMAGEMAGICK_SHA256" "$imagemagick_appimage" | sha256sum --check -
          chmod 0755 "$imagemagick_appimage"
          (
            cd "$imagemagick_root"
            "$imagemagick_appimage" --appimage-extract > /dev/null
          )
          ln -s "$imagemagick_root/squashfs-root/AppRun" "$imagemagick_bin/magick"
          "$imagemagick_bin/magick" -version | grep -F "Version: ImageMagick 7."
          echo "$imagemagick_bin" >> "$GITHUB_PATH"
      # ImageMagick's portable AppImage is not safely re-entrant when the two
      # artwork builders and the live shader test start at the same instant on
      # a small runner. Serial execution is deterministic and still finishes
      # this complete suite in seconds.
      - name: install bubblewrap so the sandbox tests can run for real
        # A hosted runner may still refuse unprivileged user namespaces. The
        # warden suite skips itself when that happens rather than passing by
        # pretending, so print the verdict: a green run whose preflight says
        # "ok": false has not tested the boundary.
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bin/iris-warden preflight || true
      - run: node --test --test-concurrency=1 tests/*.test.mjs
      # The cold-start check needs a Wayland session and the Omarchy shell,
      # so it belongs on a desktop rather than in CI: tools/coldstart-check
      # is what a release is checked with.

  manifest:
    # The same checks the shell makes before it will load this, and the
    # marketplace before it will list it: valid JSON, the required fields,
    # entry points that are relative, real, and inside the plugin, and no
    # symlinks anywhere. Cheap to run, and the failure it prevents is a
    # plugin that installs and then does nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: manifest.json is valid and complete
        run: |
          set -euo pipefail
          jq -e . manifest.json > /dev/null
          jq -e '.schemaVersion == 1' manifest.json > /dev/null
          for field in id name version author license description kinds entryPoints; do
            jq -e --arg f "$field" 'has($f)' manifest.json > /dev/null \
              || { echo "manifest is missing $field" >&2; exit 1; }
          done
          jq -e '.id | test("^[A-Za-z0-9][A-Za-z0-9._-]*$") and (startswith("omarchy.") | not)' \
            manifest.json > /dev/null
          jq -e '(.kinds | type) == "array" and (.kinds | length) > 0' manifest.json > /dev/null
          # The marketplace rejects a community manifest whose fields exceed
          # these lengths, and reports it only as "does not match the supported
          # Quattro contract" — which names no field. Catch it here instead.
          jq -e '(.id | length) <= 128 and (.name | length) <= 120
            and (.version | length) <= 64 and (.author | length) <= 120
            and (.description | length) <= 500 and (.license | length) <= 120' \
            manifest.json > /dev/null \
            || { echo "a manifest field exceeds the marketplace length limit" >&2; exit 1; }
      - name: every entry point exists and stays inside the plugin
        run: |
          set -euo pipefail
          jq -r '.entryPoints | to_entries[] | "\(.key) \(.value)"' manifest.json |
          while read -r kind path; do
            case "$path" in
              /*|*..*) echo "unsafe entry point for $kind: $path" >&2; exit 1 ;;
            esac
            [[ -f $path ]] || { echo "missing entry point for $kind: $path" >&2; exit 1; }
          done
          jq -e '[.kinds[]] | inside(["panel","bar-widget","overlay","menu","service","bar"])' \
            manifest.json > /dev/null
          jq -e '((.kinds | index("service")) == null) or ((.entryPoints.service | type) == "string")' \
            manifest.json > /dev/null
          jq -e '((.kinds | index("bar-widget")) == null) or ((.entryPoints.barWidget | type) == "string")' \
            manifest.json > /dev/null
      - name: no symlinks
        run: |
          found=$(find . -path ./.git -prune -o -type l -print)
          [[ -z $found ]] || { echo "symlinks are not allowed: $found" >&2; exit 1; }
      - name: release metadata and current visuals exist
        run: |
          set -euo pipefail
          for f in README.md LICENSE SECURITY.md THIRD_PARTY_NOTICES.md \
                   preview.png docs/moods.png docs/tempers.png; do
            [[ -s $f ]] || { echo "missing or empty: $f" >&2; exit 1; }
          done
          version=$(jq -r .version manifest.json)
          version_pattern=${version//./\\.}
          grep -Eq "^## ${version_pattern} — [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md \
            || { echo "CHANGELOG.md has no dated entry for $version" >&2; exit 1; }
          ! grep -Eiq "^## ${version_pattern} — unreleased$" CHANGELOG.md \
            || { echo "CHANGELOG.md still marks $version unreleased" >&2; exit 1; }
          grep -Fqx 'omarchy plugin add https://github.com/moerdowo/omarchy-iris.git --enable' README.md
          grep -Fqx 'omarchy plugin remove io.github.moerdowo.omarchyiris' README.md
          ! grep -Eq 'omarchy plugin (add|remove).*--yes' README.md \
            || { echo "README.md bypasses Omarchy's install/remove confirmation" >&2; exit 1; }
      - name: release payload is clean
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)(__pycache__/|.*\.py[co]$|tools/companion-hooks?$|\.webp$)' || true)
          [[ -z $bad ]] || { echo "files excluded from the release are tracked:" >&2; echo "$bad" >&2; exit 1; }
          for pet in pets/*/pet.json; do
            # A pet is either drawn or blitted. A drawn one names a renderer
            # this plugin has to actually ship, and no sheet at all; a blitted
            # one names a sheet that has to be there and a grid to cut it on.
            if jq -e 'has("render")' "$pet" > /dev/null; then
              jq -e '.render == "iris" and (has("spritesheetPath") | not)' "$pet" > /dev/null \
                || { echo "$pet is drawn but malformed" >&2; exit 1; }
              [[ -s keystone/Iris.js && -s keystone/IrisBody.qml ]] \
                || { echo "$pet names a renderer this plugin does not ship" >&2; exit 1; }
              continue
            fi
            jq -e '(.spritesheetPath | type) == "string"
              and (.rows | type) == "number" and .rows >= 1
              and (.columns == null or ((.columns | type) == "number" and .columns >= 1))' "$pet" > /dev/null
            sheet="$(dirname "$pet")/$(jq -r .spritesheetPath "$pet")"
            [[ -s $sheet ]] || { echo "missing spritesheet named by $pet: $sheet" >&2; exit 1; }
          done
      - name: maintenance scripts parse
        run: |
          set -euo pipefail
          for t in tools/coldstart-check tools/perform-check tools/companion-recolor \
                   tools/build-preview bin/iris-warden bin/iris-do; do
            [[ -x $t ]] || { echo "$t is not executable" >&2; exit 1; }
          done
          bash -n tools/coldstart-check tools/perform-check tools/companion-recolor \
            tools/build-preview bin/iris-do
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for path in [*Path("tools").glob("*.py"), Path("bin/iris-warden")]:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY

      - name: no argv outside the sandbox can auto-approve anything
        # The invariant the plugin's whole security story rests on, checked
        # here as text as well as in the suite: these flags may appear only in
        # the headless adapters, which cannot be built without the sandbox,
        # and in the tests that assert exactly that.
        run: |
          set -euo pipefail
          stray=$(grep -n -- '--yolo\|--dangerously-skip-permissions\|--allow-all\|--auto-approve\|bypassPermissions' \
            keystone/*.qml keystone/*.js || true)
          [[ -z $stray ]] || { echo "a bypass flag reached the plugin:" >&2; echo "$stray" >&2; exit 1; }
          grep -q 'if (sandboxed !== true) return null' keystone/Model.js \
            || { echo "buildTalkCommand no longer refuses to build unsandboxed" >&2; exit 1; }
